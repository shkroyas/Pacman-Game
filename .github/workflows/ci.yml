name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: python -m pytest tests/ -v
      
      - name: Run linter
        run: python -m flake8 --max-line-length 100 --ignore=E501,W503 .

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t pacman-ai:${{ github.sha }} .
      
      - name: Test Docker image
        run: |
          docker run -d --name test -p 8000:8000 pacman-ai:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/api/health
          docker stop test
